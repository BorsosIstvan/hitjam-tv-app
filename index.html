<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HitJam Store</title>
    <style>body{color:#fff;background-color:#121212;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:Arial,sans-serif;display:flex}.store-container{text-align:center;background-color:#1e1e1e;border:2px solid #333;border-radius:16px;padding:30px;box-shadow:0 8px 30px #00000080}h1{color:#ff4500;margin-bottom:10px;font-size:3rem}p{color:#aaa;margin-bottom:30px;font-size:1.2rem}.download-btn{color:#fff;background-color:#ff4500;border-radius:12px;padding:20px 40px;font-size:1.5rem;font-weight:700;text-decoration:none;transition:all .2s;display:inline-block;box-shadow:0 0 15px #ff4500}.download-btn:focus,.download-btn:hover{background-color:#ff5714;outline:none;transform:scale(1.05);box-shadow:0 0 25px #ff4500}</style>

<body>
    <div class="store-container">
        <h1>HitJam Store</h1>
        <p>Töltsd le a legfrissebb natív Android TV alkalmazást</p>

    </div>
