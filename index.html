<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HitJam TV Store</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 40px 5%;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            border-bottom: 2px solid #262626;
            padding-bottom: 20px;
        }
        .brand h1 {
            color: #ff4500;
            font-size: 2.6rem;
            letter-spacing: 1px;
        }
        .brand p {
            color: #999;
            font-size: 1.1rem;
            margin-top: 4px;
        }
        #status-badge {
            background-color: #1e1e1e;
            color: #ff8c00;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #333;
        }
        /* Play Store-szerű kártyarács */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }
        .app-card {
            background-color: #1e1e1e;
            border: 3px solid #2e2e2e;
            border-radius: 18px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }
        /* Android TV távirányító fókusz és egér hover */
        .app-card:focus, .app-card:hover {
            border-color: #ff4500;
            background-color: #252525;
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(255, 69, 0, 0.35);
            outline: none;
        }
        .app-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .app-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }
        .app-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
            word-break: break-word;
        }
        .app-meta {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 4px;
        }
        .app-desc {
            color: #bbb;
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .install-btn {
            background-color: #ff4500;
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 1.05rem;
            padding: 12px;
            border-radius: 10px;
            transition: background-color 0.2s;
        }
        .app-card:focus .install-btn, .app-card:hover .install-btn {
            background-color: #ff5e24;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>HitJam Store</h1>
            <p>Válassz alkalmazást a telepítéshez (Android TV)</p>
        </div>
        <div id="status-badge">Alkalmazások betöltése...</div>
    </header>

    <main class="app-grid" id="app-grid">
        <!-- Ide töltődnek be automatikusan az APK kártyák -->
    </main>

    <script>
        // === BEÁLLÍTÁSOK ===
        const GITHUB_USER = "borsosistvan";
        const GITHUB_REPO = "hitjam-tv-app";
        const FOLDER_PATH = ""; // Ha a főkönyvtárban vannak az APK-k, írd át erre: ""

        // Opcionális leírások és ikonok az ismert fájlnevekhez
        const APP_DETAILS = {
            "hitjamtv.apk": {
                title: "HitJam TV (Klasszikus)",
                icon: "📺",
                desc: "Online magyar TV csatornák GitHub-os csatornalistával."
            },
            "hitjamtvauto.apk": {
                title: "HitJam TV Auto (Sniffer)",
                icon: "🚀",
                desc: "Automatikus élő stream link-kereső és önjavító lejátszó."
            }
        };

        // Tartalék lista, ha nem GitHub Pages-ről fut az oldal
        const FALLBACK_APPS = [
            { name: "hitjamtv.apk", size: 0, url: "public/hitjamtv.apk" },
            { name: "hitjamtvauto.apk", size: 0, url: "public/hitjamtvauto.apk" }
        ];

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return "APK telepítő";
            const mb = (bytes / (1024 * 1024)).toFixed(1);
            return `${mb} MB • APK`;
        }

        function renderApps(apps, sourceText) {
            const grid = document.getElementById("app-grid");
            const badge = document.getElementById("status-badge");
            badge.textContent = sourceText;
            grid.innerHTML = "";

            if (apps.length === 0) {
                grid.innerHTML = "<p style='color:#888;'>Nem található .apk fájl a mappában.</p>";
                return;
            }

            apps.forEach((app, index) => {
                const info = APP_DETAILS[app.name.toLowerCase()] || {
                    title: app.name.replace(".apk", ""),
                    icon: "📦",
                    desc: "Natív Android TV alkalmazás telepítőcsomag."
                };

                const card = document.createElement("a");
                card.href = app.url;
                card.className = "app-card";
                if (index === 0) card.setAttribute("autofocus", "true");

                card.innerHTML = `
                    <div>
                        <div class="app-header">
                            <div class="app-icon">${info.icon}</div>
                            <div>
                                <div class="app-title">${info.title}</div>
                                <div class="app-meta">${formatBytes(app.size)}</div>
                            </div>
                        </div>
                        <div class="app-desc">${info.desc}</div>
                    </div>
                    <div class="install-btn">Letöltés és Telepítés</div>
                `;
                grid.appendChild(card);
            });

            // Automatikus fókusz az első kártyára TV távirányítóhoz
            const firstCard = grid.querySelector(".app-card");
            if (firstCard) firstCard.focus();
        }

        async function loadApksFromGitHub() {
            const apiUrl = `https://{GITHUB_USER}.github.io/${GITHUB_REPO}/${FOLDER_PATH}`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("API hiba");
                const files = await response.json();

                // Kiszűrjük az összes .apk fájlt
                const apkFiles = files
                    .filter(file => file.name.toLowerCase().endsWith(".apk"))
                    .map(file => ({
                        name: file.name,
                        size: file.size,
                        // Relatív útvonal a gyors letöltéshez
                        url: FOLDER_PATH ? `${FOLDER_PATH}/${file.name}` : file.name
                    }));

                renderApps(apkFiles, `${apkFiles.length} elérhető alkalmazás`);
            } catch (error) {
                // Ha helyi gépen vagy nem GitHub-on nyitod meg, betölti a tartalék listát
                renderApps(FALLBACK_APPS, "Helyi lista");
            }
        }

        loadApksFromGitHub();
    </script>
</body>
</html>
