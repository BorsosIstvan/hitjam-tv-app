name: PWA to APK Felhős Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04 # Fixen rögzítjük a stabil Ubuntu verziót a breaking change-ek elkerülésére
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Java 17 Beállítása
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK Beállítása
        uses: android-actions/setup-android@v3

      - name: Node.js Beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: APK Legenerálása a felhőben (Hivatalos npm csomaggal)
        run: |
          # A hivatalos Microsoft-ágon futtatjuk a fordítást, ami engedélyezett a felhőben
          npx @pwabuilder/pwa2apk https://hitjamparty.com --package com.hitjamradio.radiotv --output ./hitjam-radio.apk

      - name: Kész APK mentése letölthető fájlként
        uses: actions/upload-artifact@v4
        with:
          name: HitJam-Radio-TV-APK
          path: ./hitjam-radio.apk
