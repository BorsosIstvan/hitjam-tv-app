name: PWA to APK Felhős Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Kikényszerítjük a GitHub futtatóján a Node.js 24 használatát a figyelmeztetések elkerülésére
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Java 17 Beállítása (Legújabb v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Node.js 24 Beállítása (A legfrissebb Node verzió)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: APK Legenerálása a felhőben (Node 24 környezetben)
        env:
          ANDROID_HOME: /usr/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/lib/android/sdk
        run: |
          # Automatikusan elfogadjuk az Android licencszerződéseket az előre telepített SDK-hoz
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Futtatjuk a csomagolót a tiszta Node 24-es felhős környezetben
          npx github:trycua/pwa2apk https://radio.hitjamparty.com/manifest.webmanifest --package com.hitjamradio.radiotv --output ./hitjam-radio.apk

      - name: Kész APK mentése letölthető fájlként
        uses: actions/upload-artifact@v4
        with:
          name: HitJam-Radio-TV-APK
          path: ./hitjam-radio.apk
