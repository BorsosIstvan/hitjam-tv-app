name: PWA to APK Felhős Build

on:
  push:
    branches: [ main, master ] # Amikor feltolod a kódot GitHubra, azonnal elindul

jobs:
  build:
    runs-on: ubuntu-latest # Kijavítva a hibás runs-react szintaxis!
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4 # Frissítve a legújabb Node-kompatibilis verzióra

      - name: Java 17 Beállítása
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK Beállítása
        uses: android-actions/setup-android@v3

      - name: Node.js Beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: APK Legenerálása a felhőben (Linux alatt)
        run: |
          npx github:trycua/pwa2apk https://hitjamparty.com --package com.hitjamradio.radiotv --output ./hitjam-radio.apk

      - name: Kész APK mentése letölthető fájlként
        uses: actions/upload-artifact@v4 # Frissítve v4-re, így villámgyors lesz a letöltés
        with:
          name: HitJam-Radio-TV-APK
          path: ./hitjam-radio.apk
